[project]
name = "honourgod-levison-rl-summative"
version = "0.1.0"
description = "RL comparison (DQN / REINFORCE / PPO / A2C) on a cross-border crypto-fiat liquidity desk"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26",
    "torch>=2.5.0",
    "torchrl>=0.6.0",
    "tensordict>=0.6.0",
    "websockets>=13.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Which build of torch to install. Plain `uv sync` takes the default PyPI
# wheel, which keeps a fresh clone small and works everywhere. Training locally
# on an NVIDIA GPU uses `uv sync --extra cu124`; the driver must support CUDA
# 12.4 or newer (nvidia-smi reports the supported runtime).
cpu = ["torch>=2.5.0"]
cu124 = ["torch>=2.5.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]
